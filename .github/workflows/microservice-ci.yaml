name: Microservice CI

on:
  workflow_call:
    inputs:
      service:
        required: true
        type: string

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/microservices-demo/${{ inputs.service }}:sha-${{ github.sha }}

    steps:
      # -------------------
      # Checkout source
      # -------------------
      - name: Checkout code
        uses: actions/checkout@v4

      # -------------------
      # Docker Buildx
      # -------------------
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # -------------------
      # Login to GHCR
      # -------------------
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # -------------------
      # Normalize image name
      # Docker/GHCR repository names must be lowercase
      # -------------------
      - name: Normalize image name to lowercase
        id: image
        shell: bash
        run: |
          IMAGE_NAME_LOWER="${IMAGE_NAME,,}"
          echo "IMAGE_NAME=$IMAGE_NAME_LOWER" >> "$GITHUB_ENV"
          echo "name=$IMAGE_NAME_LOWER" >> "$GITHUB_OUTPUT"
          echo "Docker image: $IMAGE_NAME_LOWER"

      # -------------------
      # Build Docker image
      # -------------------
      - name: Build Image
        shell: bash
        run: |
          docker build \
            --cache-from=type=gha \
            --cache-to=type=gha,mode=max \
            -t "$IMAGE_NAME" \
            "./src/${{ inputs.service }}"

      # -------------------
      # Security Scan
      # -------------------
      - name: Run Trivy Scan
        uses: aquasecurity/trivy-action@v0.20.0
        with:
          scan-type: image
          image-ref: ${{ steps.image.outputs.name }}
          severity: HIGH,CRITICAL
          exit-code: 0
          vuln-type: os,library

      # -------------------
      # Push image to GHCR
      # -------------------
      - name: Push Image
        shell: bash
        run: |
          docker push "$IMAGE_NAME"
